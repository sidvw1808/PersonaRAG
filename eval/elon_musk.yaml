# Evaluation questions for the elon_musk persona.
#   expect_sources: source_ids that should be retrieved (see sources.yaml)
#   keywords:       facts that should appear in the retrieved passages
#   answerable:     false = the corpus can't answer it; the system should say so, not invent
# Extend this file as you add sources: aim for 30+ questions for meaningful numbers.

questions:
  - question: Why did Tesla start by building an expensive sports car?
    expect_sources: [tesla_master_plan_1]
    keywords: [sports car, affordable]

  - question: What was the original Tesla master plan?
    expect_sources: [tesla_master_plan_1, tesla_master_plan_2]
    keywords: [sports car, affordable]

  - question: Why did Tesla give away its patents?
    expect_sources: [tesla_patents]
    keywords: [good faith, patent lawsuits]

  - question: Will Tesla sue people who use its patented technology?
    expect_sources: [tesla_patents]
    keywords: [good faith]

  - question: How safe should self-driving cars be compared with human drivers?
    expect_sources: [tesla_master_plan_2]
    keywords: [10x safer, fleet learning]

  - question: Could my car earn money while I'm not using it?
    expect_sources: [tesla_master_plan_2]
    keywords: [make money for you]

  - question: Why combine solar roofs with battery storage?
    expect_sources: [tesla_master_plan_2]
    keywords: [solar roof]

  - question: Why does humanity need to go to Mars?
    expect_sources: [wikiquote_elon]
    keywords: [mars]

  - question: Is artificial intelligence dangerous?
    expect_sources: [wikiquote_elon]
    keywords: [artificial intelligence]

  - question: Do you think Tesla should expand into trucks and buses?
    expect_sources: [tesla_master_plan_2]
    keywords: []

  # --- Long-form interviews (added with the expanded corpus) ---
  - question: Why is Grok modeled after The Hitchhiker's Guide to the Galaxy?
    expect_sources: [lex_fridman_400]
    keywords: [hitchhiker]

  - question: What did you say about playing Diablo 4?
    expect_sources: [lex_fridman_400]
    keywords: [diablo]

  - question: What is the limiting factor for Starship launches right now?
    expect_sources: [lex_fridman_400]
    keywords: [regulatory approval]

  - question: Why is the Optimus humanoid robot so important for Tesla?
    expect_sources: [ted_2022_gigafactory]
    keywords: [optimus]

  - question: How many people will Starship carry to Mars at a time?
    expect_sources: [ted_2022_gigafactory]
    keywords: [100 plus people]

  - question: Why are you worried about population collapse and birth rates?
    expect_sources: [ted_2022_gigafactory]
    keywords: [birth rate]

  - question: Why do self-driving cars need to solve real-world AI and vision?
    expect_sources: [ted_2022_gigafactory]
    keywords: [biological neural net]

  - question: Why did you make an offer to buy Twitter?
    expect_sources: [ted_2022_live]
    keywords: [free speech]

  - question: Should Twitter open source its algorithm?
    expect_sources: [ted_2022_live]
    keywords: [open source the algorithm]

  - question: How do you want your AI to give physics and engineering answers people can trust?
    expect_sources: [lex_fridman_400]
    keywords: [physics]

  # Out of scope: nothing in the corpus covers these.
  - question: What is your favourite pizza topping?
    answerable: false

  - question: What is your opinion of the 2031 FIFA World Cup host city?
    answerable: false
